<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الأكواد | إدارة</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: linear-gradient(180deg, #0F1828 0%, #1A2744 30%, #1A2744 100%);
    color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  h1, h2 { font-family: 'Cairo', sans-serif; }
  .card {
    width: 100%; max-width: 460px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px; padding: 32px 26px;
  }
  h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; text-align: center; }
  .sub { font-size: 13px; color: #aebbd4; margin-bottom: 24px; text-align: center; }
  label { display: block; font-size: 13px; color: #c7d1e3; margin-bottom: 6px; font-weight: 700; }
  input {
    width: 100%; padding: 13px 15px; margin-bottom: 16px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.25); color: #fff; font-family: 'Tajawal'; font-size: 15px; outline: none;
  }
  input:focus { border-color: #F5B301; }
  .btn {
    width: 100%; padding: 15px; font-family: 'Cairo'; font-size: 16px; font-weight: 800;
    border: none; border-radius: 12px; background: linear-gradient(135deg, #F5B301, #F59001);
    color: #1A2744; cursor: pointer; transition: transform .15s, opacity .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:disabled { opacity: .6; transform: none; }
  .result {
    display: none; margin-top: 22px; padding: 20px; text-align: center;
    background: rgba(245,179,1,0.08); border: 1px solid rgba(245,179,1,0.3); border-radius: 14px;
  }
  .result .code {
    font-family: 'Cairo', monospace; font-size: 30px; font-weight: 900;
    letter-spacing: 4px; color: #F5B301; margin: 8px 0 12px;
  }
  .copy { background: transparent; border: 2px solid #F5B301; color: #F5B301; padding: 9px 20px;
    border-radius: 10px; font-family: 'Cairo'; font-weight: 700; cursor: pointer; font-size: 14px; }
  .copy:hover { background: rgba(245,179,1,0.1); }
  .hint { font-size: 12px; color: #8b99b5; margin-top: 12px; line-height: 1.6; }
  .msg { margin-top: 14px; font-size: 13.5px; text-align: center; min-height: 18px; }
  .msg.err { color: #ff8a8a; }
</style>
</head>
<body>
<div class="card">
  <h1>🔑 لوحة الأكواد</h1>
  <p class="sub">توليد كود مشاهدة جديد لشخص مصرّح له</p>

  <label>كلمة سرّ المدير</label>
  <input type="password" id="pwd" placeholder="••••••••" autocomplete="off">

  <label>اسم الشخص (اختياري — للتذكّر)</label>
  <input type="text" id="label" placeholder="مثال: أ. سامر — مدرسة النهضة" autocomplete="off">

  <button class="btn" id="genBtn">ولّد كود جديد</button>
  <div class="msg" id="msg"></div>

  <div class="result" id="result">
    <div style="font-size:13px;color:#c7d1e3;">الكود الجديد:</div>
    <div class="code" id="codeOut">----</div>
    <button class="copy" id="copyBtn">📋 انسخ الكود</button>
    <p class="hint">ابعت هذا الكود للشخص عبر واتساب.<br>صالح لمرّة وحدة — ويشتغل 48 ساعة من أوّل استخدام.</p>
  </div>
</div>

<script>
  const pwd = document.getElementById('pwd');
  const labelEl = document.getElementById('label');
  const genBtn = document.getElementById('genBtn');
  const msg = document.getElementById('msg');
  const result = document.getElementById('result');
  const codeOut = document.getElementById('codeOut');
  const copyBtn = document.getElementById('copyBtn');

  genBtn.addEventListener('click', async () => {
    if (!pwd.value) { showMsg('اكتب كلمة سرّ المدير.'); return; }
    genBtn.disabled = true; genBtn.textContent = 'جاري التوليد...'; showMsg('');
    try {
      const res = await fetch('/.netlify/functions/generate-code', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: pwd.value, label: labelEl.value })
      });
      const data = await res.json();
      if (data.ok) {
        codeOut.textContent = data.code;
        result.style.display = 'block';
        labelEl.value = '';
      } else if (data.reason === 'unauthorized') {
        showMsg('كلمة السرّ غلط.');
      } else {
        showMsg('صار خطأ. حاول مرّة تانية.');
      }
    } catch {
      showMsg('صار خطأ بالاتصال.');
    } finally {
      genBtn.disabled = false; genBtn.textContent = 'ولّد كود جديد';
    }
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(codeOut.textContent).then(() => {
      copyBtn.textContent = '✅ تم النسخ';
      setTimeout(() => copyBtn.textContent = '📋 انسخ الكود', 1500);
    });
  });

  function showMsg(t) { msg.textContent = t; msg.className = 'msg' + (t ? ' err' : ''); }
</script>
</body>
</html>
